<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SETs Energy Optimization &amp; AI ECM Proposal Tool</title>
<style>
:root{
  --teal:#1596a9; --teal-dark:#0f7683; --teal-darker:#0c5c66; --teal-light:#e5f5f7;
  --ink:#16232b; --ink-soft:#4b5c66; --line:#dbe4e7; --bg:#f4f8f9; --card:#ffffff;
  --amber:#c9820f; --red:#b3402f; --green:#1f8a4c; --purple:#6b4fbb; --purple-light:#f2eefc;
  --radius:8px; --shadow:0 1px 3px rgba(15,40,45,.08), 0 1px 2px rgba(15,40,45,.06);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;}
h1,h2,h3,h4{margin:0 0 4px;font-weight:600;letter-spacing:-.01em;}
h2{font-size:19px;color:var(--teal-darker);}
h3{font-size:15px;color:var(--ink);}
p{margin:0 0 8px;color:var(--ink-soft);}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--ink);}
input,select,textarea{
  border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
button{cursor:pointer;border:none;border-radius:6px;font-weight:600;transition:all .15s ease;}
.field{margin-bottom:12px;}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:800px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* ===== App shell ===== */
#app{max-width:1320px;margin:0 auto;padding:0 20px 60px;}
header.topbar{
  position:sticky; top:0; z-index:50; background:#fff; border-bottom:2px solid var(--teal);
  box-shadow:var(--shadow);
}
.topbar-inner{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{
  width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,var(--teal-darker),var(--teal));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.brand-text{font-size:11.5px;color:var(--ink-soft);line-height:1.25;}
.brand-text b{color:var(--teal-darker);font-size:14px;display:block;}
.topbar-title{flex:1;min-width:180px;}
.topbar-title input{font-size:16px;font-weight:700;border:1px dashed transparent;background:transparent;padding:2px 4px;color:var(--teal-darker);}
.topbar-title input:hover,.topbar-title input:focus{border-color:var(--line);background:#fff;}
.topbar-title .sub{font-size:11.5px;color:var(--ink-soft);}
.client-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.client-logo-slot{
  width:46px;height:46px;border:1.5px dashed var(--line);border-radius:6px;display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:#fafcfc;flex-shrink:0;cursor:pointer;position:relative;
}
.client-logo-slot img{width:100%;height:100%;object-fit:contain;}
.client-logo-slot span{font-size:9px;color:var(--ink-soft);text-align:center;padding:2px;}
.client-name-input{width:155px;font-weight:600;}

nav.tabs{
  display:flex; gap:2px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line);
  padding:0 20px; position:sticky; top:66px; z-index:49; box-shadow:0 1px 2px rgba(0,0,0,.03);
}
nav.tabs::-webkit-scrollbar{height:4px;}
.tab-btn{
  background:transparent;padding:12px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);
  border-bottom:3px solid transparent;white-space:nowrap;border-radius:0;
}
.tab-btn:hover{color:var(--teal-darker);background:var(--teal-light);}
.tab-btn.active{color:var(--teal-darker);border-bottom-color:var(--teal);}
.tab-btn.ai-tab{color:var(--purple);font-weight:700;}
.tab-btn.ai-tab.active{color:var(--purple);border-bottom-color:var(--purple);background:var(--purple-light);}
.tab-btn .badge{
  display:inline-block;background:var(--teal);color:#fff;font-size:10px;border-radius:10px;
  padding:1px 6px;margin-left:6px;font-weight:700;
}

main{padding-top:20px;}
.page{display:none;}
.page.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.card-head .desc{font-size:12.5px;color:var(--ink-soft);max-width:720px;margin-top:2px;}
.section-title{display:flex;align-items:center;gap:10px;}
.section-title .icon{
  width:32px;height:32px;border-radius:7px;background:var(--teal-light);color:var(--teal-darker);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}

/* buttons */
.btn{padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-ai{background:linear-gradient(135deg,#6b4fbb,#1596a9);color:#fff;box-shadow:0 2px 6px rgba(107,79,187,.25);}
.btn-ai:hover{opacity:.93;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-darker);}
.btn-danger{background:transparent;color:var(--red);border:1px solid #ecd1cb;}
.btn-danger:hover{background:#fdf1ee;}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-add{background:var(--teal-light);color:var(--teal-darker);padding:8px 12px;border-radius:6px;font-size:12.5px;font-weight:700;margin-top:8px;}
.btn-add:hover{background:#d3edf0;}
.btn-icon{background:transparent;color:var(--ink-soft);padding:4px 7px;border-radius:5px;font-size:12px;}
.btn-icon:hover{background:#f1f1f1;}
.btn-icon.danger:hover{background:#fdf1ee;color:var(--red);}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px;}
table.edit-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px;}
table.edit-table th{
  background:var(--teal-light);color:var(--teal-darker);text-align:left;padding:8px 8px;font-weight:700;
  font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;border-bottom:1px solid var(--line);
}
table.edit-table td{padding:4px 6px;border-bottom:1px solid #eef2f3;vertical-align:middle;}
table.edit-table tbody tr:hover{background:#fbfdfd;}
table.edit-table input,table.edit-table select{border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:4px;min-width:70px;}
table.edit-table input:hover,table.edit-table select:hover{border-color:var(--line);background:#fff;}
table.edit-table input:focus,table.edit-table select:focus{border-color:var(--teal);background:#fff;}
table.edit-table td.readonly{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:600;padding-left:8px;}
table.edit-table td.col-actions{width:32px;text-align:center;}
table.edit-table tfoot td{font-weight:700;background:#fafcfc;padding:8px 6px;border-top:2px solid var(--line);}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.pill-good{background:#e6f6ec;color:var(--green);}
.pill-warn{background:#fbf1e0;color:var(--amber);}
.pill-bad{background:#fbeae6;color:var(--red);}
.pill-ai{background:var(--purple-light);color:var(--purple);}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:linear-gradient(155deg,#fff,var(--teal-light));border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
.kpi .val{font-size:20px;font-weight:800;color:var(--teal-darker);margin-top:3px;}
.kpi .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}

/* attachments */
.attach-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.attach-chip{
  display:flex;align-items:center;gap:6px;background:#fafcfc;border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font-size:12px;max-width:240px;
}
.attach-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
.attach-chip button{background:transparent;color:var(--ink-soft);font-size:13px;padding:0 2px;}
.attach-chip button:hover{color:var(--red);}
.dropzone{
  border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--ink-soft);
  font-size:12.5px;cursor:pointer;transition:.15s;
}
.dropzone:hover,.dropzone.drag{border-color:var(--teal);background:var(--teal-light);}

/* ECM cards */
.ecm-card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fdfefe;}
.ecm-card .ecm-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;}
.ecm-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.ecm-metrics .m{text-align:left;}
.ecm-metrics .m .lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;letter-spacing:.03em;}
.ecm-metrics .m .val{font-size:15px;font-weight:800;color:var(--teal-darker);}

/* AI Recommendation Cards */
.ai-rec-card{
  border:1px solid #d8cef0;border-left:4px solid var(--purple);border-radius:8px;padding:16px;
  margin-bottom:14px;background:#fff;box-shadow:var(--shadow);
}
.ai-rec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
.ai-rec-title{font-size:15.5px;font-weight:700;color:var(--ink);}
.ai-rationale{background:#f8f6fc;border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft);margin:10px 0;}
.ai-steps{margin:8px 0 0 18px;padding:0;font-size:12.5px;color:var(--ink-soft);}
.ai-steps li{margin-bottom:3px;}

.subservice{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;background:#fcfdfd;}
.subservice-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.subservice-head input.name{font-size:14px;font-weight:700;border:1px dashed transparent;background:transparent;max-width:280px;}
.subservice-head input.name:hover,.subservice-head input.name:focus{border-color:var(--line);background:#fff;}

.hint{font-size:11.5px;color:var(--ink-soft);background:var(--teal-light);border-radius:6px;padding:8px 10px;margin-bottom:12px;}
.hint b{color:var(--teal-darker);}

footer.status-bar{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 20px;
  font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;z-index:60;
}
footer.status-bar span.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;}

.chart-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;}
.chart-box canvas{max-height:290px;}

/* Report / print */
.report-cover{text-align:center;padding:36px 20px;border-bottom:2px solid var(--teal);margin-bottom:24px;}
.report-cover .logos{display:flex;justify-content:center;align-items:center;gap:30px;margin-bottom:18px;}
.report-cover .logos img{height:56px;object-fit:contain;}
.report-cover h1{font-size:26px;color:var(--teal-darker);}
.report-cover .meta{color:var(--ink-soft);font-size:13px;margin-top:6px;}
.report-section{margin-bottom:26px;padding:0 16px;}
.report-section h2{border-bottom:2px solid var(--teal-light);padding-bottom:6px;margin-bottom:12px;}

@media print{
  header.topbar,nav.tabs,footer.status-bar,.no-print{display:none !important;}
  #app{max-width:100%;padding:0;}
  body{background:#fff;font-size:11.5px;}
  .page{display:none !important;}
  #reportPrintArea{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  .print-header{
    display:flex !important;justify-content:space-between;align-items:center;border-bottom:2px solid var(--teal);
    padding-bottom:8px;margin-bottom:14px;
  }
  table.edit-table th{background:#eef7f8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .chart-box{break-inside:avoid;}
}
#reportPrintArea{display:none;}

.file-input-hidden{display:none;}
.small-note{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.two-col-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.session-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
.session-bar .who{font-weight:700;color:var(--teal-darker);}
.role-pill{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:10px;background:var(--teal-light);color:var(--teal-darker);cursor:pointer;}
.role-pill.admin{background:#fdeccb;color:#8a5a06;}
.attribution{font-size:10.5px;color:var(--ink-soft);margin-top:6px;font-style:italic;}
.source-pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.02em;}
.source-pill.metered{background:#e6f6ec;color:var(--green);}
.source-pill.calculated{background:#fbf1e0;color:var(--amber);}
.source-pill.none{background:#fbeae6;color:var(--red);}

/* Toast notification */
#toastBox{position:fixed;bottom:44px;right:20px;z-index:250;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:7px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:fade .2s ease;}
</style>
</head>
<body>

<div id="app">

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">SETs</div>
      <div class="brand-text"><b>SETs</b>Energy Optimization &amp; AI Proposal</div>
    </div>
    <div class="topbar-title">

      <div class="client-logo-slot" id="clientLogoSlot" title="Click to upload client logo"><span>Client<br>Logo</span></div>

    <div class="session-bar no-print" id="sessionBar"></div>
  </div>
</header>

<nav class="tabs" id="tabNav">
  <button class="tab-btn active" data-page="project">1. Project Info</button>
  <button class="tab-btn" data-page="hvac">2. HVAC Plant</button>
  <button class="tab-btn" data-page="lighting">3. Lighting</button>
  <button class="tab-btn" data-page="other">4. Other Services</button>
  <button class="tab-btn" data-page="consumption">5. Energy Baseline</button>
  <button class="tab-btn" data-page="benchmark">6. Benchmarking</button>
  <button class="tab-btn" data-page="costing" id="tabCosting">7. Cost Estimation</button>
  <button class="tab-btn ai-tab" data-page="ai">✨ 8. AI ECM Recommender</button>
  <button class="tab-btn" data-page="summary">9. ECM &amp; ROI Summary<span class="badge" id="ecmCountBadge">0</span></button>
  <button class="tab-btn" data-page="report">10. Proposal Report / PDF</button>
</nav>

<main>
  <div class="page active" id="page-project"></div>
  <div class="page" id="page-hvac"></div>
  <div class="page" id="page-lighting"></div>
  <div class="page" id="page-other"></div>
  <div class="page" id="page-consumption"></div>
  <div class="page" id="page-benchmark"></div>

  <div class="page" id="page-summary"></div>

</div>

<div id="reportPrintArea"></div>
<div id="toastBox"></div>

<footer class="status-bar no-print">
  <div><span class="dot"></span><span id="saveStatus">Ready • Local SQLite + Browser Storage Active</span></div>
  <div id="aiEngineStatus">Checking Local AI Engine (Qwen2.5-Coder-32B)...</div>
</footer>

<script src="/static/chart.umd.js"></script>
<script>
(function(){
"use strict";

/* ---------- Utilities ---------- */
let uidCounter = 1;
function uid(){ return 'id'+(Date.now().toString(36))+(uidCounter++).toString(36); }
function num(v,d){ const n=parseFloat(v); return isNaN(n)?(d===undefined?0:d):n; }
function fmt(n,dec){
  if(n===null||n===undefined||isNaN(n)) return '—';
  dec = dec===undefined?0:dec;
  return Number(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtMoney(n,sym){
  sym = sym||(state.project.currency||'AED');
  if(n===null||n===undefined||isNaN(n)) return '—';
  return sym+' '+fmt(n,0);
}
function pct(n,dec){ if(n===null||n===undefined||isNaN(n)) return '—'; return fmt(n,dec===undefined?1:dec)+'%'; }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }

function showToast(msg){
  const box = document.getElementById('toastBox');
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(()=>d.remove(), 3400);
}

/* ---------- Financial Engine ---------- */
const Fin = {
  simplePayback(investment, annualSavings){
    if(annualSavings<=0) return null;
    return investment/annualSavings;
  },
  cashflows(investment, annualSavings, lifeYears, escalation){
    escalation = escalation||0;
    const cf=[-investment];
    for(let y=1;y<=lifeYears;y++){
      cf.push(annualSavings*Math.pow(1+escalation/100,y-1));
    }
    return cf;
  },
  npv(rate, cf){
    let total=0;
    for(let t=0;t<cf.length;t++){ total += cf[t]/Math.pow(1+rate/100,t); }
    return total;
  },
  irr(cf){
    if(cf.length<2) return null;
    const hasPos = cf.some(v=>v>0), hasNeg = cf.some(v=>v<0);
    if(!hasPos || !hasNeg) return null;
    let lo=-99, hi=1000;
    let fLo=Fin.npv(lo,cf), fHi=Fin.npv(hi,cf);
    if(isNaN(fLo)||isNaN(fHi)||fLo*fHi>0) return null;
    let mid, fMid;
    for(let i=0;i<200;i++){
      mid=(lo+hi)/2; fMid=Fin.npv(mid,cf);
      if(Math.abs(fMid)<1e-6) break;
      if((fLo<0 && fMid<0)||(fLo>0 && fMid>0)){ lo=mid; fLo=fMid; } else { hi=mid; }
    }
    return mid;
  },
  discountedPayback(rate, cf){
    let cum=0;
    for(let t=0;t<cf.length;t++){
      const dcf = cf[t]/Math.pow(1+rate/100,t);
      const prevCum = cum;
      cum += dcf;
      if(cum>=0 && t>0){
        const frac = (0-prevCum)/dcf;
        return (t-1)+frac;
      }
    }
    return null;
  },
  roi(investment, totalSavings){
    if(investment<=0) return null;
    return ((totalSavings-investment)/investment)*100;
  }
};

/* ---------- State & Demo Data ---------- */
let currentUser = { username: 'zakariya', fullName: 'Zakariya Abdul Bari', role: 'admin' };
let lastAIRecommendations = null;

function defaultState(){
  return {
    id: 'proj_default',
    project:{
      name:'Al Barsha Mall Energy Optimization', client:'Al Barsha Retail Group',
      address:'Sheikh Zayed Road, Al Barsha 1', city:'Dubai, UAE',
      year:2026, buildingType:'Shopping Mall',
      grossArea:38500, leaseType:'Master Leased Commercial', stories:4,
      contacts:[{name:'Eng. Zakariya Abdul Bari — Lead Energy Auditor',phone:'zakariya@sets-energy.ae'}],

/* ---------- Generic Editable Table ---------- */
function editableTable(container, columns, rows, opts){
  opts = opts||{};
  function computeRow(r){ if(opts.compute) opts.compute(r); return r; }
  function draw(){
    rows.forEach(computeRow);
    let html = '<div class="table-wrap"><table class="edit-table"><thead><tr>';
    columns.forEach(c=>html+=`<th style="${c.width?('width:'+c.width+';'):''}">${c.label}</th>`);
    html += '<th class="col-actions"></th></tr></thead><tbody>';
    rows.forEach((row,i)=>{
      html+='<tr data-i="'+i+'">';
      columns.forEach(c=>{
        if(c.readonly){
          let v = c.format ? c.format(row) : row[c.key];
          html+=`<td class="readonly">${v}</td>`;
        } else if(c.type==='select'){
          html+=`<td><select data-k="${c.key}">`+c.options.map(o=>`<option value="${esc(o)}" ${row[c.key]===o?'selected':''}>${esc(o)}</option>`).join('')+`</select></td>`;
        } else if(c.type==='checkbox'){
          html+=`<td style="text-align:center"><input type="checkbox" data-k="${c.key}" ${row[c.key]?'checked':''}></td>`;
        } else {
          html+=`<td><input type="${c.type||'text'}" ${c.step?('step="'+c.step+'"'):''} data-k="${c.key}" value="${esc(row[c.key]===undefined?'':row[c.key])}" placeholder="${esc(c.placeholder||'')}"></td>`;
        }
      });
      html+=`<td class="col-actions"><button class="btn-icon danger" data-act="del">✕</button></td></tr>`;
    });
    html+='</tbody>';
    if(opts.footer){ html += '<tfoot><tr>'+opts.footer(rows)+'</tr></tfoot>'; }
    html+='</table></div>';
    html+=`<button class="btn-add" data-act="add">+ Add Row</button>`;
    container.innerHTML = html;

    container.querySelectorAll('tbody tr').forEach(tr=>{
      const i = +tr.dataset.i;
      tr.querySelectorAll('[data-k]').forEach(el=>{
        const k = el.dataset.k;
        const ev = (el.type==='checkbox'||el.tagName==='SELECT')?'change':'input';
        el.addEventListener(ev, ()=>{
          rows[i][k] = el.type==='checkbox'? el.checked : (el.type==='number'? (el.value===''?'':parseFloat(el.value)) : el.value);
          if(opts.compute) opts.compute(rows[i]);
          if(opts.onChange) opts.onChange();
          if(ev==='change' || opts.compute) draw();
          markDirty();
        });
      });
      tr.querySelector('[data-act="del"]').addEventListener('click',()=>{
        rows.splice(i,1); draw(); if(opts.onChange) opts.onChange(); markDirty();
      });
    });
    container.querySelector('[data-act="add"]').addEventListener('click',()=>{
      const newRow = opts.newRow? opts.newRow(): {};
      rows.push(newRow); draw(); if(opts.onChange) opts.onChange(); markDirty();
    });
  }
  draw();
  return { redraw: draw };
}

/* ---------- Energy Calculator Component (Affinity Law) ---------- */
function renderEnergyCalc(container, rows, onChangeCb){
  const cols = [
    {key:'name', label:'Equipment / Area', placeholder:'e.g. Chilled Water Pump 1'},
    {key:'ratedKW', label:'Rated Power (kW)', type:'number', step:'0.01'},
    {key:'qty', label:'Qty', type:'number'},
    {key:'hoursDay', label:'Op. Hrs/Day', type:'number', step:'0.5'},
    {key:'daysYear', label:'Days/Year', type:'number'},
    {key:'loadPct', label:'Load Factor %', type:'number', step:'1'},
    {key:'hasVFD', label:'VFD?', type:'checkbox'},
    {key:'vfdSpeedPct', label:'Avg VFD Speed %', type:'number', step:'1'},
    {key:'annualKWh', label:'Annual Energy (kWh)', readonly:true, format:r=>fmt(r.annualKWh,0)}
  ];
  editableTable(container, cols, rows, {
    newRow: ()=>({id:uid(), name:'', ratedKW:'', qty:1, hoursDay:12, daysYear:365, loadPct:85, hasVFD:false, vfdSpeedPct:80, annualKWh:0}),
    compute: r=>{
      const base = num(r.ratedKW)*num(r.qty,1);
      let effKW = r.hasVFD ? base*Math.pow(num(r.vfdSpeedPct,100)/100,3) : base*(num(r.loadPct,100)/100);
      r.annualKWh = effKW*num(r.hoursDay)*num(r.daysYear);
    },
    footer: rows=>{
      const total = rows.reduce((s,r)=>s+num(r.annualKWh),0);
      return `<td colspan="8" style="text-align:right">Total Calculated Annual Energy</td><td>${fmt(total,0)} kWh</td>`;
    },
    onChange: onChangeCb
  });
}

const ECM_CATEGORIES = [
  'Chiller Plant Optimization','VFD Installation','AHU Controls Upgrade','Modulating PICV',
  'Lighting Retrofit (LED)','FCU Controls Upgrade','New DDC Controller','Water Delta-T Control',

function computeSingleECM(e){
  const rate = num(e.energyRate, state.project.energyRate||0.44);
  let annualSavingsAED;
  if(e.manualSavings){
    annualSavingsAED = num(e.annualSavingsAED);
  } else {
    annualSavingsAED = num(e.annualSavingsKWh)*rate;
    e.annualSavingsAED = annualSavingsAED;
  }
  const life = Math.max(1, num(e.lifeYears,10));
  const rateD = num(e.discountRate, state.project.discountRate||8);
  const cf = Fin.cashflows(num(e.investment), annualSavingsAED, life, 0);
  const totalSavings = annualSavingsAED*life;
  e._simplePayback = Fin.simplePayback(num(e.investment), annualSavingsAED);
  e._roi = Fin.roi(num(e.investment), totalSavings);
  e._npv = Fin.npv(rateD, cf);
  e._irr = Fin.irr(cf);
  e._dpp = Fin.discountedPayback(rateD, cf);
  e._annualSavingsAED = annualSavingsAED;
}

/* ---------- Helper Bindings ---------- */
function getPath(obj, path){ return path.split('.').reduce((o,k)=>(o===undefined||o===null)?o:o[k], obj); }
function setPath(obj, path, val){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++) o=o[parts[i]]; o[parts[parts.length-1]]=val; }
function textField(label, path, opts){
  opts=opts||{};
  const val = getPath(state, path);
  const type = opts.type||'text';
  return `<div class="field"><label>${label}</label>
    ${opts.textarea?`<textarea data-path="${path}" rows="${opts.rows||2}">${esc(val)}</textarea>`
      : `<input type="${type}" ${opts.step?`step="${opts.step}"`:''} data-path="${path}" value="${esc(val===undefined||val===null?'':val)}" ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}>`}
  </div>`;
}
function bindFields(container){
  container.querySelectorAll('[data-path]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input', ()=>{
      const v = el.type==='number' ? (el.value===''?'':parseFloat(el.value)) : el.value;
      setPath(state, el.dataset.path, v);
      markDirty();
      if(el.dataset.path==='project.name') document.getElementById('projectTitleInput').value = el.value;
      if(el.dataset.path==='project.client') document.getElementById('clientNameInput').value = el.value;
    });
  });
}

/* ---------- Page 5: Energy Baseline ---------- */
function allEnergyCalcRows(){
  const groups = [
    {label:'HVAC', rows: state.hvac.energyCalc},
    {label:'Lighting', rows: state.lighting.energyCalc},
    ...state.other.services.map(s=>({label:s.name, rows: s.energyCalc}))
  ];
  const out=[];
  groups.forEach(g=>g.rows.forEach(r=>{
    const base = num(r.ratedKW)*num(r.qty,1);
    const eff = r.hasVFD ? base*Math.pow(num(r.vfdSpeedPct,100)/100,3) : base*(num(r.loadPct,100)/100);
    out.push({section:g.label, name:r.name, annualKWh: eff*num(r.hoursDay)*num(r.daysYear)});
  }));
  return out;
}
function getBuildingAnnualConsumption(){
  const metered = state.consumption.electricity.reduce((s,r)=>s+Math.max(0,num(r.current)-num(r.previous)),0);
  const calculated = allEnergyCalcRows().reduce((s,r)=>s+num(r.annualKWh),0);
  const monthlyBench = state.benchmark.monthly.reduce((s,r)=>s+num(r.energyKWh),0);
  let used, source;
  if(monthlyBench>0){ used=monthlyBench; source='metered'; }
  else if(metered>0){ used=metered; source='metered'; }
  else if(calculated>0){ used=calculated; source='calculated'; }
  else { used=0; source='none'; }
  return {metered: Math.max(metered, monthlyBench), calculated, used, source};
}

function computeBenchKpis(){
  const rows = state.benchmark.monthly;
  const monthlyE = rows.reduce((s,r)=>s+num(r.energyKWh),0);
  const baseline = getBuildingAnnualConsumption();
  const totalE = monthlyE>0 ? monthlyE : baseline.used;
  const totalW = rows.reduce((s,r)=>s+num(r.waterL),0);
  const gcfa = num(state.project.grossArea) || 35000;
  const eui = gcfa && totalE? totalE/gcfa : null;
  const wui = gcfa && totalW? totalW/gcfa : null;
  const box = document.getElementById('benchKpis');
  if(!box) return;
  function ratingPill(v, low, avg, high){
    if(v===null) return '<span class="pill pill-warn">No data</span>';
    if(v<=low) return '<span class="pill pill-good">Efficient (Best-in-Class)</span>';
    if(v<=avg) return '<span class="pill pill-good">Better than Average</span>';
    if(v<=high) return '<span class="pill pill-warn">Above Average</span>';
    return '<span class="pill pill-bad">High Consumer</span>';
  }
  box.innerHTML = `
    <div class="kpi"><div class="lbl">Site Energy Use Intensity (EUI)</div><div class="val">${eui?fmt(eui,1):'—'}</div><div class="sub">kWh/m²/yr ${ratingPill(eui,state.benchmark.lowEUI,state.benchmark.avgEUI,state.benchmark.highEUI)}</div></div>
    <div class="kpi"><div class="lbl">Site Water Use Intensity (WUI)</div><div class="val">${wui?fmt(wui,0):'—'}</div><div class="sub">L/m²/yr ${ratingPill(wui,state.benchmark.lowWUI,state.benchmark.avgWUI,state.benchmark.highWUI)}</div></div>
    <div class="kpi"><div class="lbl">Total Annual Electricity</div><div class="val">${fmt(totalE,0)}</div><div class="sub">kWh / year</div></div>
    <div class="kpi"><div class="lbl">Gross Conditioned Area</div><div class="val">${fmt(gcfa,0)}</div><div class="sub">m²</div></div>
  `;
}

function drawBenchChart(){
  const ctx = document.getElementById('euiChart'); if(!ctx || !window.Chart) return;
  const baseline = getBuildingAnnualConsumption();
  const gcfa = num(state.project.grossArea) || 35000;
  const eui = gcfa? +(baseline.used/gcfa).toFixed(1) : 0;
  const ecmSavKWh = allECMs().reduce((s,e)=>s+num(e.annualSavingsKWh),0);
  const postEui = gcfa? +((Math.max(0, baseline.used - ecmSavKWh))/gcfa).toFixed(1) : eui;

  if(benchChart) benchChart.destroy();
  benchChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:['Low Consumer Benchmark','Average Benchmark','High Consumer Benchmark','Current Site EUI','Post-ECM Target EUI'],
      datasets:[{
        label:'EUI (kWh/m²/yr)',
        data:[state.benchmark.lowEUI, state.benchmark.avgEUI, state.benchmark.highEUI, eui, postEui],
        backgroundColor:['#9fd8de','#5bb7c2','#c9820f','#b3402f','#1f8a4c']
      }]
    },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });
}

      let row = `<tr data-i="${i}"><td class="readonly">${i+1}</td>

        <td><select data-k="level">${levelOpts(r)}</select></td>`;
      if(isAdmin) row += `<td><input type="number" data-k="high" value="${r.high||0}"></td><td><input type="number" data-k="med" value="${r.med||0}"></td><td><input type="number" data-k="low" value="${r.low||0}"></td>`;
      row += `<td class="readonly">${fmtMoney(r.total)}</td><td><button class="btn-icon danger" data-act="del" data-i="${i}">✕</button></td></tr>`;
      return row;
    }).join('');
    const grandTotal = rows.reduce((s,r)=>s+num(r.total),0);

      <tfoot><tr><td colspan="${isAdmin?7:4}" style="text-align:right">Grand Total Estimated Retrofit Capex</td><td colspan="2">${fmtMoney(grandTotal)}</td></tr></tfoot>

function applyRecommendedECMs(recs){
  let added = 0;
  recs.forEach(r=>{
    const ecmObj = {
      id: uid(),
      description: r.title,
      category: r.category,
      investment: r.estimated_investment,
      annualSavingsKWh: r.expected_savings_kwh,
      energyRate: state.project.energyRate || 0.44,
      annualSavingsAED: r.expected_savings_cost,
      manualSavings: false,
      lifeYears: 10,
      discountRate: state.project.discountRate || 8,
      notes: r.technical_rationale,
      createdBy: 'AI Engine (Qwen2.5-32B)',
      createdAt: Date.now()
    };
    computeSingleECM(ecmObj);
    if(r.category.toLowerCase().includes('lighting')){
      const exists = state.lighting.ecms.some(x=>x.description===r.title);
      if(!exists){ state.lighting.ecms.push(ecmObj); added++; }
    } else {
      const exists = state.hvac.ecms.some(x=>x.description===r.title);
      if(!exists){ state.hvac.ecms.push(ecmObj); added++; }
    }
  });
  refreshBadges();
  markDirty();
  showToast(`✅ Added ${added} ECM(s) to your Proposal! View them in Tab 9 (ECM & ROI Summary).`);
}

/* ---------- Page 9: ECM & ROI Summary ---------- */
function allECMs(){
  const groups = [
    {label:'HVAC', ecms: state.hvac.ecms},
    {label:'Lighting', ecms: state.lighting.ecms},
    ...state.other.services.map(s=>({label:s.name, ecms: s.ecms}))
  ];
  const out=[];
  groups.forEach(g=>g.ecms.forEach(e=>{
    computeSingleECM(e);
    out.push(Object.assign({_section:g.label}, e));
  }));
  return out;
}

          <td>${i+1}</td>
          <td>${esc(e._section)}</td>
          <td><b>${esc(e.description||'')}</b><br><span style="font-size:11px;color:var(--ink-soft);">${esc(e.notes||'')}</span></td>
          <td>${esc(e.category)}</td>
          <td>${fmtMoney(num(e.investment))}</td>
          <td>${fmt(num(e.annualSavingsKWh),0)}</td>
          <td>${fmtMoney(e._annualSavingsAED)}</td>
          <td><b>${e._simplePayback?fmt(e._simplePayback,1)+' yrs':'—'}</b></td>
          <td>${e._roi!==null?pct(e._roi,0):'—'}</td>
          <td>${fmtMoney(e._npv)}</td>
          <td>${e._irr!==null?pct(e._irr,1):'—'}</td>
        </tr>`).join('') || '<tr><td colspan="11">No ECMs added yet.</td></tr>'}
        </tbody>
        ${ecms.length ? `<tfoot><tr><td colspan="4" style="text-align:right">Total Portfolio</td><td>${fmtMoney(totalInv)}</td><td>${fmt(totalAnnualSavKWh,0)} kWh</td><td>${fmtMoney(totalAnnualSav)}</td><td>${blendedPayback?fmt(blendedPayback,1)+' yrs':'—'}</td><td colspan="3"></td></tr></tfoot>` : ''}
      </table></div>
    </div>

    <div class="report-section">
      <h2>3. Installed HVAC &amp; Lighting Asset Summary</h2>
      <p><b>Chiller Plant:</b> ${state.hvac.chillerEquipment.map(c=>`${c.qty}x ${c.brand} ${c.device} (${c.notes})`).join(' • ') || 'As surveyed'}</p>
      <p><b>Air-Side Equipment:</b> ${state.hvac.airsideUnits.map(a=>`${a.qty}x ${a.category} (${a.tag})`).join(' • ') || 'As surveyed'}</p>
      <p><b>Chilled Water Loop:</b> Supply ${esc(state.hvac.performance.supplyTemp)}°C / Return ${esc(state.hvac.performance.returnTemp)}°C (Delta-T: ${(num(state.hvac.performance.returnTemp)-num(state.hvac.performance.supplyTemp)).toFixed(1)}°C)</p>
    </div>
  `;
}

/* ---------- Navigation & Initialization ---------- */
function refreshBadges(){
  document.getElementById('ecmCountBadge').textContent = allECMs().length;
}

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const btn = document.querySelector(`.tab-btn[data-page="${name}"]`);
  if(btn) btn.classList.add('active');

  const renderers = {
    project:renderProjectPage, hvac:renderHvacPage, lighting:renderLightingPage,
    other:renderOtherPage, consumption:renderConsumptionPage, benchmark:renderBenchmarkPage,
    costing:renderCostingPage, ai:renderAIPage, summary:renderSummaryPage, report:renderReportPage
  };
  if(renderers[name]) renderers[name]();
  refreshBadges();
}

function renderSessionBar(){
  const bar = document.getElementById('sessionBar');
  bar.innerHTML = `<span class="who">${esc(currentUser.fullName)}</span>
    <span class="role-pill ${currentUser.role==='admin'?'admin':''}" id="roleSwitchBtn" title="Click to toggle Admin / Engineer view">${currentUser.role}</span>`;
  document.getElementById('roleSwitchBtn').addEventListener('click', ()=>{
    currentUser.role = currentUser.role==='admin' ? 'engineer' : 'admin';
    renderSessionBar();
    showToast(`Switched view mode to: ${currentUser.role.toUpperCase()}`);
    if(document.getElementById('page-costing').classList.contains('active')) renderCostingPage();
  });
}

function initTopbar(){
  document.getElementById('projectTitleInput').addEventListener('input',e=>{ state.project.name=e.target.value; markDirty(); });
  document.getElementById('clientNameInput').addEventListener('input',e=>{ state.project.client=e.target.value; markDirty(); });
  const slot = document.getElementById('clientLogoSlot');
  const fileInp = document.getElementById('clientLogoFile');
  slot.addEventListener('click',()=>fileInp.click());
  fileInp.addEventListener('change',()=>{
    const f = fileInp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ state.project.clientLogo = reader.result; renderLogoSlot(); markDirty(); };
    reader.readAsDataURL(f);
  });
  document.getElementById('loadDemoBtn').addEventListener('click', ()=>{
    state = defaultState();
    lastAIRecommendations = null;
    document.getElementById('projectTitleInput').value = state.project.name;
    document.getElementById('clientNameInput').value = state.project.client;
    showPage('ai');
    showToast('🏢 Loaded Demo Mall Project & Running AI ECM Analysis!');
  });
  document.getElementById('saveServerBtn').addEventListener('click', saveToServer);
  
  const aiBtn = document.getElementById('aiServiceControlBtn');
  if(aiBtn) aiBtn.addEventListener('click', triggerAIServiceAction);
}

function renderLogoSlot(){
  const slot = document.getElementById('clientLogoSlot');
  slot.innerHTML = state.project.clientLogo ? `<img src="${state.project.clientLogo}">` : '<span>Client<br>Logo</span>';
}

function init(){
  try {
    const saved = localStorage.getItem('sets_energy_state_v2');
    if(saved){
      const parsed = JSON.parse(saved);
      state = Object.assign(defaultState(), parsed);
    }
  } catch(e){}

  document.getElementById('projectTitleInput').value = state.project.name||'';
  document.getElementById('clientNameInput').value = state.project.client||'';
  renderLogoSlot();
  initTopbar();
  renderSessionBar();
  checkAIHealth();

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>showPage(btn.dataset.page));
  });
  showPage('project');
  setInterval(checkAIHealth, 7000);
}

init();
})();
</script>
</body>
</html>
